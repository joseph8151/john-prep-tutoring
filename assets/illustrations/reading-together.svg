<svg viewBox="0 0 480 576" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="원어민 선생님과 아이가 소파에 나란히 앉아 함께 책을 읽는 모습 일러스트">
  <rect width="480" height="576" fill="#173F35"/>
  <rect width="480" height="576" fill="#2A5648" opacity="0.35"/>

  <!-- bookshelf backdrop, upper area -->
  <g opacity="0.5">
    <line x1="0" y1="120" x2="480" y2="120" stroke="#F8F5EE" stroke-width="3"/>
    <rect x="40" y="60" width="26" height="60" fill="#A9B9A5"/>
    <rect x="72" y="46" width="22" height="74" fill="#EAE4D8"/>
    <rect x="100" y="66" width="30" height="54" fill="#7E9078"/>
    <rect x="356" y="52" width="24" height="68" fill="#EAE4D8"/>
    <rect x="384" y="64" width="28" height="56" fill="#A9B9A5"/>
    <rect x="416" y="42" width="22" height="78" fill="#7E9078"/>
  </g>

  <!-- sofa -->
  <path d="M40,420 L440,420 L440,470 C440,486 428,498 412,498 L68,498 C52,498 40,486 40,470 Z" fill="#EAE4D8"/>
  <rect x="40" y="392" width="400" height="46" rx="20" fill="#F8F5EE"/>
  <rect x="52" y="366" width="60" height="70" rx="18" fill="#A9B9A5"/>
  <rect x="368" y="366" width="60" height="70" rx="18" fill="#A9B9A5"/>

  <!-- teacher figure (left, sitting on sofa) — abstract silhouette -->
  <g>
    <path d="M120,420 C120,364 140,320 176,320 C212,320 232,364 232,420 Z" fill="#10241E"/>
    <path d="M120,356 C96,366 82,388 78,414" stroke="#10241E" stroke-width="22" fill="none" stroke-linecap="round"/>
    <circle cx="172" cy="282" r="42" fill="#E3B873"/>
  </g>

  <!-- child figure (right, sitting on sofa) — smaller, lighter tone -->
  <g>
    <path d="M252,420 C252,378 268,344 294,344 C320,344 336,378 336,420 Z" fill="#7E9078"/>
    <path d="M330,352 C352,360 364,378 368,398" stroke="#7E9078" stroke-width="16" fill="none" stroke-linecap="round"/>
    <circle cx="292" cy="312" r="30" fill="#E7C9A9"/>
  </g>

  <!-- open book across both laps -->
  <g>
    <path d="M158,392 L232,382 L232,414 L158,428 Z" fill="#FFFFFF"/>
    <path d="M306,392 L232,382 L232,414 L306,428 Z" fill="#F3F0E8"/>
    <line x1="232" y1="382" x2="232" y2="414" stroke="#A9B9A5" stroke-width="2"/>
    <line x1="170" y1="398" x2="216" y2="392" stroke="#E4E0D2" stroke-width="3"/>
    <line x1="170" y1="408" x2="210" y2="403" stroke="#E4E0D2" stroke-width="3"/>
    <line x1="248" y1="394" x2="290" y2="399" stroke="#E4E0D2" stroke-width="3"/>
    <line x1="252" y1="406" x2="292" y2="410" stroke="#E4E0D2" stroke-width="3"/>
  </g>
</svg>
