<svg viewBox="0 0 480 576" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="학부모와 JOHN PREP 상담자가 테이블에 마주 앉아 아이의 영어 학습 상담을 나누는 모습 일러스트">
  <rect width="480" height="576" fill="#F8F5EE"/>

  <!-- backdrop panel -->
  <rect x="0" y="0" width="480" height="330" fill="#EAE4D8"/>

  <!-- window -->
  <rect x="360" y="60" width="80" height="98" rx="4" fill="#F8F5EE" stroke="#7E9078" stroke-width="4"/>
  <line x1="400" y1="60" x2="400" y2="158" stroke="#7E9078" stroke-width="4"/>
  <line x1="360" y1="108" x2="440" y2="108" stroke="#7E9078" stroke-width="4"/>

  <!-- plant -->
  <g>
    <path d="M40,470 L68,470 L62,510 L46,510 Z" fill="#7E9078"/>
    <path d="M54,470 C40,442 34,414 54,394" stroke="#6E8568" stroke-width="7" fill="none" stroke-linecap="round"/>
    <path d="M54,470 C66,446 72,418 56,398" stroke="#8FA689" stroke-width="7" fill="none" stroke-linecap="round"/>
  </g>

  <!-- round table -->
  <ellipse cx="240" cy="440" rx="140" ry="34" fill="#FFFFFF"/>
  <ellipse cx="240" cy="440" rx="140" ry="34" fill="none" stroke="#A9B9A5" stroke-width="3"/>
  <rect x="228" y="440" width="24" height="70" fill="#E4E0D2"/>

  <!-- notepad on table -->
  <rect x="204" y="420" width="60" height="42" rx="4" fill="#FFFFFF" stroke="#A9B9A5" stroke-width="2"/>
  <line x1="212" y1="432" x2="256" y2="432" stroke="#E4E0D2" stroke-width="3"/>
  <line x1="212" y1="442" x2="248" y2="442" stroke="#E4E0D2" stroke-width="3"/>
  <line x1="212" y1="452" x2="252" y2="452" stroke="#E4E0D2" stroke-width="3"/>

  <!-- two mugs -->
  <circle cx="160" cy="432" r="14" fill="#A9B9A5"/>
  <circle cx="320" cy="432" r="14" fill="#A9B9A5"/>

  <!-- consultant figure (left) -->
  <g>
    <path d="M74,470 C96,456 142,456 164,472 L164,488 C142,496 96,496 74,488 Z" fill="#10241E"/>
    <rect x="82" y="356" width="94" height="118" rx="32" fill="#173F35"/>
    <path d="M176,388 C198,398 210,418 212,442" stroke="#173F35" stroke-width="20" fill="none" stroke-linecap="round"/>
    <circle cx="128" cy="328" r="31" fill="#E7C9A9"/>
    <path d="M97,322 A31,31 0 0 1 159,322 L159,306 A31,25 0 0 0 97,306 Z" fill="#23302A"/>
  </g>

  <!-- parent figure (right) -->
  <g>
    <path d="M316,472 C338,458 384,458 406,474 L406,490 C384,498 338,498 316,490 Z" fill="#7E9078"/>
    <rect x="326" y="360" width="88" height="112" rx="30" fill="#A9B9A5"/>
    <path d="M326,392 C304,402 292,420 288,444" stroke="#A9B9A5" stroke-width="18" fill="none" stroke-linecap="round"/>
    <circle cx="370" cy="332" r="29" fill="#E7C9A9"/>
    <path d="M341,326 A29,29 0 0 1 399,326 L399,312 A29,23 0 0 0 341,312 Z" fill="#23302A"/>
  </g>
</svg>
