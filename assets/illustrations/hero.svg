<svg viewBox="0 0 480 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="원어민 선생님과 아이가 거실 러그에 앉아 그림책을 함께 보는 1:1 방문 영어수업 장면 일러스트">
  <rect width="480" height="560" fill="#F8F5EE"/>

  <!-- backdrop arch -->
  <path d="M64,560 L64,236 A176,176 0 0 1 416,236 L416,560 Z" fill="#EAE4D8"/>

  <!-- window -->
  <g>
    <rect x="46" y="86" width="86" height="104" rx="4" fill="#F8F5EE" stroke="#7E9078" stroke-width="4"/>
    <line x1="89" y1="86" x2="89" y2="190" stroke="#7E9078" stroke-width="4"/>
    <line x1="46" y1="138" x2="132" y2="138" stroke="#7E9078" stroke-width="4"/>
    <path d="M46,86 Q40,70 30,64" stroke="#A9B9A5" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M132,86 Q140,68 152,60" stroke="#A9B9A5" stroke-width="6" fill="none" stroke-linecap="round"/>
  </g>

  <!-- hanging plant top right -->
  <g>
    <line x1="404" y1="0" x2="404" y2="66" stroke="#7E9078" stroke-width="3"/>
    <ellipse cx="404" cy="80" rx="30" ry="18" fill="#8FA689"/>
    <ellipse cx="388" cy="72" rx="16" ry="10" fill="#6E8568"/>
    <ellipse cx="420" cy="72" rx="16" ry="10" fill="#6E8568"/>
  </g>

  <!-- rug -->
  <ellipse cx="240" cy="494" rx="198" ry="48" fill="#A9B9A5"/>
  <ellipse cx="240" cy="494" rx="150" ry="34" fill="none" stroke="#7E9078" stroke-width="3"/>

  <!-- floor plant bottom right -->
  <g>
    <path d="M420,470 L448,470 L442,510 L426,510 Z" fill="#7E9078"/>
    <path d="M434,470 C420,440 414,412 434,392" stroke="#6E8568" stroke-width="7" fill="none" stroke-linecap="round"/>
    <path d="M434,470 C446,446 452,418 436,398" stroke="#8FA689" stroke-width="7" fill="none" stroke-linecap="round"/>
    <path d="M434,466 C424,450 424,432 438,416" stroke="#6E8568" stroke-width="6" fill="none" stroke-linecap="round"/>
  </g>

  <!-- teacher figure (left) — abstract silhouette, no facial detail -->
  <g>
    <ellipse cx="166" cy="500" rx="58" ry="14" fill="#173F35" opacity="0.08"/>
    <path d="M110,500 C110,440 128,396 176,396 C224,396 242,440 242,500 Z" fill="#173F35"/>
    <path d="M232,430 C258,440 274,462 278,490" stroke="#173F35" stroke-width="22" fill="none" stroke-linecap="round"/>
    <circle cx="176" cy="354" r="44" fill="#E3B873"/>
  </g>

  <!-- child figure (right) — smaller, lighter tone -->
  <g>
    <ellipse cx="296" cy="504" rx="44" ry="11" fill="#173F35" opacity="0.06"/>
    <path d="M254,504 C254,458 268,424 298,424 C328,424 342,458 342,504 Z" fill="#A9B9A5"/>
    <path d="M254,444 C236,450 224,464 220,482" stroke="#A9B9A5" stroke-width="16" fill="none" stroke-linecap="round"/>
    <circle cx="298" cy="396" r="30" fill="#E7C9A9"/>
  </g>

  <!-- open picture book between them -->
  <g>
    <path d="M180,470 L240,462 L240,504 L180,514 Z" fill="#FFFFFF"/>
    <path d="M300,470 L240,462 L240,504 L300,514 Z" fill="#F3F0E8"/>
    <line x1="240" y1="462" x2="240" y2="504" stroke="#A9B9A5" stroke-width="2"/>
    <line x1="192" y1="478" x2="228" y2="474" stroke="#E4E0D2" stroke-width="3"/>
    <line x1="192" y1="488" x2="222" y2="485" stroke="#E4E0D2" stroke-width="3"/>
    <line x1="254" y1="474" x2="286" y2="478" stroke="#E4E0D2" stroke-width="3"/>
    <line x1="258" y1="486" x2="284" y2="489" stroke="#E4E0D2" stroke-width="3"/>
  </g>
</svg>
