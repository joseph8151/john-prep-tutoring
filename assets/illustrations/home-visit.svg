<svg viewBox="0 0 480 576" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="원어민 선생님이 가방을 들고 학생의 집 현관에 방문하고 아이가 반갑게 맞이하는 모습 일러스트">
  <rect width="480" height="576" fill="#F8F5EE"/>

  <!-- floor -->
  <rect x="0" y="470" width="480" height="106" fill="#EAE4D8"/>
  <rect x="0" y="470" width="480" height="6" fill="#A9B9A5"/>

  <!-- doorway frame -->
  <rect x="176" y="70" width="150" height="410" fill="#FFFFFF"/>
  <rect x="176" y="70" width="150" height="410" fill="none" stroke="#A9B9A5" stroke-width="6"/>
  <!-- door, slightly ajar -->
  <path d="M186,86 L300,100 L300,468 L186,462 Z" fill="#2A5648"/>
  <circle cx="284" cy="284" r="6" fill="#EAE4D8"/>

  <!-- small entry table (interior, right) -->
  <rect x="352" y="410" width="90" height="10" rx="4" fill="#7E9078"/>
  <rect x="360" y="420" width="8" height="50" fill="#7E9078"/>
  <rect x="426" y="420" width="8" height="50" fill="#7E9078"/>
  <path d="M366,392 L316,382 L316,410 L366,418 Z" fill="#FFFFFF"/>
  <line x1="326" y1="394" x2="356" y2="399" stroke="#E4E0D2" stroke-width="3"/>
  <line x1="326" y1="402" x2="352" y2="406" stroke="#E4E0D2" stroke-width="3"/>

  <!-- teacher figure entering from left (exterior side) — abstract silhouette -->
  <g>
    <path d="M56,498 C56,434 76,384 112,384 C148,384 168,434 168,498 Z" fill="#173F35"/>
    <path d="M70,414 C46,426 32,450 28,480" stroke="#173F35" stroke-width="22" fill="none" stroke-linecap="round"/>
    <circle cx="118" cy="332" r="46" fill="#E3B873"/>
    <!-- tote bag -->
    <rect x="26" y="420" width="46" height="42" rx="8" fill="#A9B9A5"/>
    <path d="M34,420 C34,404 64,404 64,420" stroke="#7E9078" stroke-width="6" fill="none"/>
  </g>

  <!-- child figure greeting near table (interior side) -->
  <g>
    <path d="M360,500 C360,462 374,434 398,434 C422,434 436,462 436,500 Z" fill="#A9B9A5"/>
    <circle cx="397" cy="386" r="28" fill="#E7C9A9"/>
    <!-- waving arm -->
    <path d="M420,432 C438,420 448,400 446,378" stroke="#A9B9A5" stroke-width="15" fill="none" stroke-linecap="round"/>
  </g>

  <!-- soft rug interior -->
  <ellipse cx="380" cy="500" rx="86" ry="20" fill="#E4E0D2"/>
</svg>
