<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  @font-face {
    font-family: 'Manrope';
    src: local('Manrope');
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ width:1200px; height:630px; overflow:hidden; }
  body{
    font-family: 'Pretendard Variable','Manrope',-apple-system,sans-serif;
    background: #173F35;
    position: relative;
  }
  .arch{
    position:absolute; left:-120px; top:-160px; width:620px; height:620px; border-radius:50%;
    background: rgba(169,185,165,0.14);
  }
  .arch2{
    position:absolute; right:-100px; bottom:-180px; width:520px; height:520px; border-radius:50%;
    background: rgba(234,228,216,0.08);
  }
  .content{ position:relative; z-index:1; padding: 84px 90px; height:100%; display:flex; flex-direction:column; justify-content:center; }
  .logo{ font-weight:800; font-size:34px; color:#FFFFFF; letter-spacing:-0.01em; margin-bottom:36px; }
  .badge{
    display:inline-block; font-weight:800; font-size:19px; letter-spacing:0.02em;
    color:#173F35; background:#EAE4D8; padding:12px 22px; border-radius:30px; margin-bottom:34px; width:fit-content;
  }
  h1{ font-weight:800; font-size:52px; line-height:1.32; color:#FFFFFF; margin-bottom:26px; max-width:820px; }
  p{ font-weight:500; font-size:24px; line-height:1.6; color:rgba(255,255,255,0.72); max-width:760px; }
</style>
</head>
<body>
  <div class="arch"></div>
  <div class="arch2"></div>
  <div class="content">
    <div class="logo">존프랩튜터링</div>
    <div class="badge">100% North American Native Teachers</div>
    <h1>만 2세부터, 미국·캐나다 원어민<br>선생님과의 1:1 방문 영어수업</h1>
    <p>전담 매니저 상담 후, 아이에게 맞는 원어민 선생님을 소개합니다.</p>
  </div>
</body>
</html>
